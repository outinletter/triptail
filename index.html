<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#1f4d3a"><title>TripTail · 여행 사진 스토리</title><link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" href="icon.png"><link rel="apple-touch-icon" href="icon.png"><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="topbar"><div class="brand"><span class="brand-mark">✦</span><div><strong>TripTail</strong><small>사진이 여행 이야기가 되는 순간</small></div></div><button class="ghost" id="demoBtn">샘플로 둘러보기</button></header>
<main>
<section class="hero"><div><p class="eyebrow">TRAVEL STORY MAKER</p><h1>사진을 정리하고,<br><em>여행 글을 자동으로</em> 완성하세요.</h1><p class="lead">사진을 올리고 여행 정보를 입력하면 여행 이야기와 블로그용 HTML을 만들어 드립니다.</p></div><div class="hero-card"><span>✍️</span><p>사진 분석과<br>블로그 글쓰기</p></div></section>
<section class="workspace">
<div class="panel upload-panel"><div class="panel-head"><div><span class="step">01</span><h2>사진 올리기</h2></div><span class="count" id="photoCount">0장</span></div><label class="dropzone" id="dropzone"><input type="file" id="fileInput" accept="image/*" multiple><span class="upload-icon">＋</span><strong>사진을 끌어다 놓거나 눌러서 선택</strong><small>JPG, PNG, WEBP · 여러 장 업로드 가능</small></label><div class="photo-grid" id="photoGrid"></div></div>
<div class="panel settings-panel"><div class="panel-head"><div><span class="step">02</span><h2>여행 정보</h2></div></div><label>여행지 <input id="place" placeholder="예: 교토 기요미즈데라"></label><div class="two-col"><label>방문 날짜<input id="date" type="date"></label><label>글 분위기<select id="tone"><option>따뜻하고 감성적으로</option><option>역사 다큐멘터리처럼</option><option>간결한 여행 정보형</option></select></label></div><label>여행 메모<textarea id="memo" rows="4" placeholder="현장에서 느낀 점이나 가이드에게 들은 이야기를 적어주세요."></textarea></label><button class="primary" id="deepSeekBtn" type="button">AI로 사진 분석·글쓰기 <span>→</span></button><p class="hint">사진을 분석해 여행 이야기와 네이버 블로그·티스토리용 HTML을 자동으로 만듭니다.</p></div>
</section>
<section class="results panel hidden" id="results"><div class="panel-head"><div><span class="step">03</span><h2>사진 분석 결과</h2></div></div><div id="groups"></div></section>
<section class="preview panel hidden" id="preview"><div class="panel-head"><div><span class="step">04</span><h2>완성된 여행 글</h2></div><button class="ghost" id="copyBtn">HTML 복사</button></div><label class="result-input">생성된 HTML<textarea id="chatGptResult" rows="10"></textarea></label><div class="result-actions"><button class="secondary" id="previewBtn">미리보기 갱신</button><button class="primary" id="downloadBtn">HTML 다운로드 <span>↓</span></button></div><article id="article"></article></section>
</main><footer>TripTail · 여행의 순간을 오래 남기는 방법</footer><script src="app.js"></script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
